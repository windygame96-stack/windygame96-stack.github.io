 prefSection('哪些地点在你的考虑范围内？','location',['当前城市','其他境内城市','其他国家或地区','地点可谈','暂不确定']),
 prefSection('你能接受怎样的出差？','travel',['不接受','短期偶发','定期但有频率上限','较长出差可谈','暂不确定'],false),
 prefSection('是否考虑驻外或长期异地？','relocation',['不考虑','满足合适条件可考虑','可以考虑','暂不确定'],false),
 prefSection('你能接受怎样的工作时间？','schedule',['固定时间','弹性时间','轮班可谈','时差协作可谈','暂不确定'])
 ];}
function stepForQuestion(id){if(['Q03','Q04'].includes(id))return 2;if(['Q07','Q08'].includes(id))return 3;if(['Q09','Q10','Q11','Q22'].includes(id))return 4;if(['Q12','Q13'].includes(id))return 5;if(['Q15','Q16'].includes(id))return 6;return 7;}
function review(){const r=getResult(),all=D.questions.filter(q=>r.required.includes(q.id));const box=node('div','preview-count');append(box,text('strong',r.totalRequired?`${r.answered}/${r.totalRequired}`:'—'));const t=node('div');append(t,text('h2','计分信息已明确'),text('p',r.ready?'可以生成完整的岗位类别准备分。':'仍有不确定的部分，也可以先看已完成的盘点。'));box.append(t);const panels=[box];
 if(r.problems.length)panels.push(text('div','还需要：'+r.problems.join('、')+'。否则报告不生成岗位总分。','note-box'));
 const summary=panel('本次选择',null);append(summary,text('p',`方向：${r.role?.name||'尚未明确'}${r.variant?' · '+r.variant.name:''}`,'readonly-values'),text('p',`阶段：${D.stages.find(s=>s.id===state.stage)?.name||'尚未明确'}${state.ignoreGrade?' · 忽略成绩情景':''}`,'readonly-values'),button('修改方向与阶段','btn btn-text',()=>go(0)));panels.push(summary);
 const bgReview=panel('学历与学校计分复核','这两项已参与总分；专业大类仍按原选择展示。');const degreeDim=r.dimensions.find(d=>d.id==='D4'),schoolDim=r.dimensions.find(d=>d.id==='D3');bgReview.append(lineRow('学历阶段',degreeLabel()+(degreeDim.score===null?' · 暂不能计分':' · 本项 '+degreeDim.score.toFixed(1))));bgReview.append(lineRow('学校分档',schoolSummary()||'尚未明确'));if([...degreeDim.missing,...schoolDim.missing].length)bgReview.append(text('p','待明确：'+[...new Set([...degreeDim.missing,...schoolDim.missing])].join('、'),'helper missing-text'));bgReview.append(button('修改学历与学校','btn btn-text',()=>go(1)));panels.push(bgReview);
 const p=panel('主分答案复核','不确定的答案不会按 0 分处理。');coreDimensionGroups(p,all);panels.push(p);panels.push(text('div','学历、学校等级和英语按岗位权重计分；工作安排另算选择空间分。答案不保存，刷新会清空。','note-box green'));return panels;
}
function coreDimensionGroups(parent,questions){D.dimensions.filter(d=>questions.some(q=>q.dim===d.id)).forEach(d=>{const group=node('div','review-group');group.append(text('h3',d.name));questions.filter(q=>q.dim===d.id).forEach(q=>{const row=node('div','review-row');append(row,text('span',q.title),text('span',displayAnswer(q.id),'review-answer'+(E.raw(state,q.id)===null?' missing-text':'')),button('修改','link-btn',()=>go(stepForQuestion(q.id))));group.append(row);});parent.append(group);});}
function quiz(){
 const layout=node('div','layout');const sidebar=node('aside','sidebar');append(sidebar,text('div','YOUR CARDS','eyebrow'),text('div','一步一步来。','sidebar-title'),text('p','不确定的部分，可以先留白。'));
 const list=node('nav','step-list');list.setAttribute('aria-label','测评步骤');sections.forEach(([label],i)=>{const b=button('','step-link'+(step===i?' active':'')+(visited.has(i)?' done':''),()=>go(i));if(step===i)b.setAttribute('aria-current','step');append(b,text('span',visited.has(i)&&step!==i?'✓':String(i+1).padStart(2,'0'),'step-n'),text('span',label));list.append(b);});sidebar.append(list);sidebar.append(text('div','答案只在当前页面，刷新会清空。无需提交任何文件。','sidebar-note'));layout.append(sidebar);
 const content=node('div','content');const top=node('div','step-top');append(top,text('div',`第 ${step+1} / ${sections.length} 步`,'eyebrow'),text('div','','small muted'));top.lastChild.id='answer-count';content.append(top);const prog=node('div','progress');prog.setAttribute('role','progressbar');prog.setAttribute('aria-valuenow',step+1);prog.setAttribute('aria-valuemin','1');prog.setAttribute('aria-valuemax',String(sections.length));prog.setAttribute('aria-label','测评步骤进度');const fill=node('div','progress-fill');fill.style.width=`${(step+1)/sections.length*100}%`;prog.append(fill);content.append(prog);content.append(heading(sections[step][0],sections[step][1],sections[step][2]));
 const renderers=[setup,education,professional,academics,practice,()=>[questionsPanel('协作与分歧',['Q12','Q13'],null,'计入主分')],()=>[questionsPanel('优先级与求助',['Q15','Q16'],null,'计入主分')],languages,preferences,review];
 renderers[step]().forEach(n=>content.append(n));
 const nav=node('div','navigation');nav.append(button(step===0?'返回介绍':'← 上一步','btn btn-secondary',()=>{if(step===0){screen='landing';render(true);}else go(step-1);}));const right=node('div','navigation-right');if(step<9)right.append(button('先跳过这步','btn btn-text',()=>go(step+1)));right.append(button(step===9?'查看我的报告  ↗':'下一步  →','btn btn-primary',()=>{if(step===9){screen='report';render(true);}else go(step+1);}));nav.append(right);content.append(nav);content.append(text('p','可以返回修改；不确定或跳过不会自动计为 0 分。','step-summary'));layout.append(content);main.append(layout);updateProgress();
}
function lineRow(label,value,cls='preference-row'){const row=node('div',cls);append(row,text('span',label),text('span',value||'暂未提供'));return row;}
function formatPrefs(v){return Array.isArray(v)?v.join('、'):(v||'暂未明确');}
function reportSnapshot(result){
 const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));const date=parts.year+'-'+parts.month+'-'+parts.day;
 const raw={result,roleLabel:result.role.name+(result.variant&&result.variant.name!==result.role.name?' · '+result.variant.name:''),fileRole:result.variant?.name||result.role.short,stageLabel:D.stages.find(x=>x.id===state.stage)?.name||'阶段未明确',ignoreGrade:state.ignoreGrade,generatedOn:date,dateCode:date.replace(/\D/g,''),education:E.educationStages(state).map(level=>({label:degreeLabel(level),school:tierLabel(state.education[level].tier),major:state.education[level].tier==='na'?'':state.education[level].major})),certificateLabel:result.certificate?result.certificate.name+(result.certificate.score?' · '+result.certificate.score:result.certificate.type==='none'?'':' · 成绩暂未提供'):'暂未提供',otherLanguages:state.otherLanguages.filter(x=>x.name).map(x=>({...x}))};
 return JSON.parse(JSON.stringify(raw));
}
async function downloadCurrentReport(){
 if(exportBusy)return;const result=getResult();if(!result.ready){announce('请先补齐计分信息，再下载报告。');return;}const snapshot=reportSnapshot(result);exportBusy=true;
 const buttons=[...document.querySelectorAll('.report-download')];buttons.forEach(b=>{b.disabled=true;b.textContent='正在生成图片…';});const notice=document.getElementById('download-status');if(notice){notice.textContent='正在生成当前报告的长图，请稍等。';notice.className='download-status';}
 try{await window.AssessmentExport.download(snapshot);const message='图片已生成，请在浏览器下载中查看；文件包含本次 '+result.score.toFixed(1)+' 分的报告。';if(notice)notice.textContent=message;announce(message);}catch(error){const message=error.message||'报告图片生成失败，请重试。';if(notice){notice.textContent=message;notice.className='download-status error';}announce(message);}finally{exportBusy=false;const nowReady=screen==='report'&&getResult().ready;buttons.forEach(b=>{b.disabled=!nowReady;b.textContent='下载报告图片';});}
}
function downloadButton(ready){const b=button('下载报告图片','btn btn-primary report-download',downloadCurrentReport);b.disabled=!ready||exportBusy;if(!ready)b.title='补齐计分信息后可下载完整报告';return b;}
function report(){
 const r=getResult(),wrap=node('div','report compact-report');
 const head=node('div','report-head');const titles=node('div');append(titles,text('div','YOUR CAREER CARDS','eyebrow'),text('h1','你的求职筹码报告'),text('p',(r.variant?.name||r.role?.name||'方向未明确')+' · '+(D.stages.find(x=>x.id===state.stage)?.name||'阶段未明确')+(state.ignoreGrade?' · 忽略成绩情景':'')));
 const tools=node('div','report-head-actions');append(tools,downloadButton(r.ready),button('修改答案','btn btn-secondary',()=>go(9)));append(head,titles,tools);wrap.append(head);
 const status=text('p',r.ready?'':'补齐计分信息后，可下载完整报告。','download-status');status.id='download-status';status.setAttribute('role','status');wrap.append(status);
 const hero=node('section','report-hero'),score=node('div','score-block');append(score,text('div','岗位准备分','score-caption'));const number=text('div',r.ready?r.score.toFixed(1):'—','score-number');number.append(text('small',r.ready?'/100':'待补齐'));score.append(number);hero.append(score);
 const insight=node('div','score-insight');append(insight,text('h2',r.verdict?.title||'先别急着贴标签'),text('p',r.verdict?.line||('还需'+[...r.problems,...(r.missing.length?[r.missing.length+'项计分信息']:[])].join('、')+'。')));hero.append(insight);wrap.append(hero);
 const grid=node('div','dim-grid');r.dimensions.forEach(d=>{const card=node('section','dim-card');const top=node('div','compact-dim-top');append(top,text('h3',d.name),text('strong',d.score===null?'待补齐':d.score.toFixed(0)+'/100','compact-score'));card.append(top);if(d.id==='D9')card.append(text('span','独立分 · 不影响总分','small muted'));else if(d.weight===0)card.append(text('span','本情景不计入总分','small muted'));append(card,text('h4',d.comment.title,'dimension-quip'),text('p',d.comment.line,'dimension-comment'));grid.append(card);});wrap.append(grid);
 const next=window.AssessmentReport.nextSteps(r);if(next.length){const section=panel('先补这两件事');const actions=node('div','priority-grid');next.forEach((p,i)=>{const card=node('div','action-card');append(card,text('h3',(i+1)+'. '+p.title),text('p',p.action));actions.append(card);});section.append(actions);wrap.append(section);}
 const details=node('details','section compact-proof');details.append(text('summary','查看评分依据与我的回答'));
 details.append(text('p','岗位准备分＝各项得分×岗位权重之和。选择空间分单列；未知不按零分计算。','helper'));
 const scroller=node('div','score-table-wrap'),table=node('table','score-table'),thead=node('thead'),tr=node('tr');['项目','得分','权重','贡献'].forEach(x=>tr.append(text('th',x)));thead.append(tr);table.append(thead);const tbody=node('tbody');r.dimensions.filter(d=>d.weight>0).forEach(d=>{const row=node('tr');[d.name,d.score===null?'未明确':d.score.toFixed(1),d.weight.toFixed(1)+'%',d.contribution===null?'—':d.contribution.toFixed(2)].forEach(x=>row.append(text('td',x)));tbody.append(row);});table.append(tbody);scroller.append(table);details.append(scroller);
 r.dimensions.filter(d=>d.id!=='D9').forEach(d=>{details.append(text('h3',d.name));details.append(text('p',d.reason||'本情景未启用','desc'));(d.evidence||[]).forEach(ev=>details.append(text('p',ev.label+'：'+ev.answer,'desc')));});
 details.append(text('h3','求职选择空间分'));details.append(text('p','五项等权取均分；多选取该项最高范围分。只估算可接受的安排范围，不代表岗位数量、能力或录用概率。','desc'));
 r.space.evidence.forEach(ev=>details.append(text('p',ev.label+'：'+ev.answer+(ev.score===null?'（未明确）':'（'+ev.score+'分）'),'desc')));
 const maps=window.AssessmentReport.spaceAxes;maps.forEach(axis=>details.append(text('p',axis.label+'：'+Object.entries(axis.values).map(([k,v])=>k+' '+v+'分').join('；'),'desc')));
 const snapshot=reportSnapshot(r);details.append(text('h3','教育与语言'));snapshot.education.forEach(ed=>details.append(text('p',ed.label+' · '+ed.school+' · '+ed.major,'desc')));details.append(text('p','英语证书：'+snapshot.certificateLabel,'desc'));snapshot.otherLanguages.forEach(x=>details.append(text('p',x.name+' · '+x.level,'desc')));
 if(r.background.length)details.append(text('p','学历、学校与既有成绩短期难改变，优先用作品、实践和表达补强。','desc'));
 if(state.ignoreGrade)details.append(text('p','已忽略成绩并重新分配权重，与标准情景不可直接比较。','desc'));
 wrap.append(details);
 const actions=node('div','report-actions');append(actions,downloadButton(r.ready),button('换个岗位','btn btn-secondary',()=>go(0)),button('重新开始','btn btn-text',()=>{showReset=true;render(false);}));wrap.append(actions);
 if(showReset){const reset=panel('清空本次回答？');append(reset,button('确认清空，重新开始','btn btn-primary',()=>{state=E.fresh();visited=new Set();showReset=false;screen='landing';render(true);}),button('继续保留','btn btn-text',()=>{showReset=false;render(false);}));wrap.append(reset);}
 wrap.append(text('p','自评参考，不代表录用概率；趣味称号只描述本次回答。','source-note'));wrap.append(privacy());main.append(wrap);
}
function render(moveFocus){
 const focused=document.activeElement;const oldId=focused?.id;const oldKey=focused?.dataset?.focusKey;focusCounts={};
 main.replaceChildren();try{if(!unlocked)accessGate();else if(screen==='landing')landing();else if(screen==='quiz')quiz();else report();}catch(error){main.append(text('div','信息暂时无法计算：'+error.message,'error'));main.append(button('返回选择方向','btn btn-secondary',()=>{step=0;screen='quiz';render(true);}));}
 if(!moveFocus){const target=oldId?document.getElementById(oldId):[...main.querySelectorAll('[data-focus-key]')].find(x=>x.dataset.focusKey===oldKey);target?.focus({preventScroll:true});}
 if(moveFocus){window.scrollTo({top:0,behavior:'instant'});main.focus({preventScroll:true});announce(screen==='quiz'?sections[step][1]:screen==='report'?'已生成本次报告':'回到介绍页');}
}
render(false);
})();
</script></body></html>
