<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src data: blob:; base-uri 'none'; form-action 'none'"><title>密码访问 · 工作性价比</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8f1;color:#303448;font:16px/1.75 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}main{max-width:460px;margin:12vh auto;padding:28px}section{background:#fff;border:1px solid #f0dfd4;border-radius:22px;padding:30px}h1{font-size:26px;margin:12px 0}p{font-size:14px;color:#737481}label{display:block;font-size:14px;margin:24px 0 8px}input,button{font:inherit;width:100%;border-radius:12px;padding:12px 14px;min-height:48px}input{border:1px solid #ddd;background:#fff;color:inherit}button{border:0;background:#ed705d;color:#fff;font-weight:700;margin-top:14px;cursor:pointer}button:disabled{opacity:.6}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #3b6aaf;outline-offset:3px}a{color:#a65d4f;font-size:13px}#status{min-height:26px;color:#a55045;font-size:13px}.mark{font-size:50px;margin:0}small{font-size:11px;color:#888}</style></head><body><main><section><div class="mark" aria-hidden="true">🐙</div><h1>工作性价比</h1><p>这份测试需要密码才能打开。<br>请输入分享者提供的访问密码。</p><form id="unlock"><label for="password">访问密码</label><input id="password" type="password" inputmode="numeric" autocomplete="off" required autofocus><button type="submit" id="submit">解锁测试</button><div id="status" role="status" aria-live="polite"></div></form><p><a href="/tests/">← 返回测试实验室</a></p><small>v3.5 偏好前置版 · 下载约 136 KB。密码只在当前页面用于解锁，不会上传；刷新后需重新输入。网站托管服务可能记录访问日志。</small><noscript><p>请启用浏览器 JavaScript 后使用。</p></noscript></section></main><script>const salt=Uint8Array.from(atob('c20pB9OLOfbL6+LCacHqaA=='),c=>c.charCodeAt(0)),iv=Uint8Array.from(atob('fCvPXWPYbMdNBgZd'),c=>c.charCodeAt(0));
let payload=null,busy=false;
document.getElementById('unlock').addEventListener('submit',async e=>{
 e.preventDefault();if(busy)return;busy=true;
 const button=document.getElementById('submit'),status=document.getElementById('status'),field=document.getElementById('password');button.disabled=true;button.textContent='正在解锁…';status.textContent='正在准备解锁…';
 try{
  if(!globalThis.crypto?.subtle){status.textContent='当前浏览器不支持安全解锁，请使用新版浏览器和 HTTPS 地址。';return}

     const buffer=new Uint8Array(received);let offset=0;for(const part of chunks){buffer.set(part,offset);offset+=part.length}payload=buffer;
