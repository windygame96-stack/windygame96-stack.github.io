<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="16 道旅行情境题，看看你的旅行习惯，和搭子对一对出发前要聊什么。">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>旅行搭子人格测试</title>
<style>
:root {
  color-scheme: light;
  --paper:#f8f6ed;
  --ink:#1c302b;
  --green:#235444;
  --muted:#52625a;
  --line:#dadcd0;
  --accent:#e6a35d;
  font-family:"DM Sans","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:var(--paper);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
button,summary{font:inherit}
button{cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid #88511c;outline-offset:4px}
button:disabled{cursor:default}
h1,h2,p,figure{margin:0}
h1:focus{outline:none}
.shell{max-width:1280px;margin:auto;padding:0 46px}
.site-header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px}
.site-header{height:81px;border-bottom:1px solid var(--line)}
.wordmark{display:flex;align-items:center;gap:10px;font-weight:750;font-size:15px}
.compass{display:grid;place-items:center;width:32px;height:32px;background:var(--green);color:#fcf8e9;border-radius:50%;font-size:19px}
.header-note,footer{color:var(--muted);font-size:13px}
.hero{display:grid;grid-template-columns:1fr 1.14fr;gap:42px;align-items:center;padding:48px 0 40px}
.eyebrow{display:flex;gap:9px;align-items:center;color:var(--green);font-weight:700;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:#b96f34}
.hero h1{font-family:"Instrument Serif","Songti SC","Noto Serif CJK SC",serif;font-size:clamp(52px,6.15vw,89px);line-height:1.13;letter-spacing:-.07em;margin:18px 0 22px}
.hero h1 em{font-style:normal;color:var(--green)}
.intro{color:var(--muted);font-size:16px;line-height:1.85;max-width:31em}
.start-actions,.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:26px}
.primary,.secondary,.plain{min-height:48px;padding:11px 18px;border:1px solid transparent;border-radius:8px;font-weight:700}
.primary{display:inline-flex;align-items:center;gap:23px;background:var(--green);color:white}
.primary:hover{background:#173d31}
.secondary{background:transparent;color:var(--ink);border-color:#a8b5aa}
.secondary:hover,.plain:hover{background:#eaece1}
.plain{background:transparent;color:var(--green)}
.privacy{margin-top:16px;font-size:13px;color:var(--muted);line-height:1.6}
.hero-image{aspect-ratio:1.23;position:relative;overflow:hidden;border-radius:14px;background:linear-gradient(154deg,#b6d7dc 0 40%,#648c73 41% 53%,#4a8788 54% 66%,#c4a263 67%);border:1px solid #234e3c24}
.hero-image img{width:100%;height:100%;object-fit:cover;display:block}
.facets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--line);padding:23px 0}
.facets>div{padding:0 20px;border-left:1px solid var(--line)}
.facets>div:first-child{padding-left:0;border-left:0}
.facets span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e6ebde;color:var(--green);font-size:20px;margin-bottom:10px}
.facets h2{font-size:16px;margin-bottom:5px}
.facets p{font-size:13px;line-height:1.65;color:var(--muted)}
footer{min-height:70px}
.flow{max-width:760px;margin:43px auto 32px;min-height:min(530px,70vh)}
.sheet{padding:clamp(17px,4vw,38px);border:1px solid var(--line);border-radius:16px;background:#fffdf6}
.flow h1{font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:clamp(26px,4.1vw,43px);line-height:1.32;overflow-wrap:anywhere}
.flow h2{font-size:18px;line-height:1.5}
.flow p{line-height:1.7}
.subtitle{color:var(--muted);margin:10px 0 0}
.progress-label{display:flex;justify-content:space-between;gap:8px;color:var(--green);font-size:14px;font-weight:700}
progress{width:100%;height:7px;appearance:none;margin:9px 0 21px;border:0;background:#e7eadd;border-radius:6px}
progress::-webkit-progress-bar{background:#e7eadd;border-radius:6px}
progress::-webkit-progress-value{background:var(--green);border-radius:6px}
progress::-moz-progress-bar{background:var(--green);border-radius:6px}
.options{display:grid;gap:9px;margin-top:22px}
.option{display:flex;gap:12px;align-items:center;min-height:55px;width:100%;padding:10px 13px;text-align:left;font-size:16px;line-height:1.5;background:#fffdf7;color:var(--ink);border:1px solid var(--line);border-radius:9px}
.option:hover,.option[aria-pressed="true"]{border-color:var(--green);background:#e8efe6}
.option-letter{display:grid;place-items:center;flex:0 0 26px;height:26px;border-radius:50%;background:#ebeee3;font-size:13px;font-weight:700}
.quiz-actions{margin-top:12px;justify-content:space-between}
.review-list,.results{display:grid;gap:10px;margin-top:22px}
.review-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.review-row h2{font-size:15px}
.review-row p{font-size:14px;color:var(--muted);margin-top:3px}
.review-row button{padding-inline:11px}
.result-header{background:#e9eee3}
.result-header .eyebrow{margin-bottom:10px}
.dimension{padding:16px 18px;border:1px solid var(--line);border-radius:11px;background:#fffdf7}
.dimension-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:5px;margin-bottom:5px}
.dimension-head span{font-size:13px;color:var(--muted)}
.status{font-size:14px;font-weight:700;color:var(--green)}
.scale{margin:12px 0}
.scale-track{position:relative;height:7px;margin:0 6px 7px;background:#e0e7db;border-radius:8px}
.scale-track span{position:absolute;top:50%;width:13px;height:13px;transform:translate(-50%,-50%);background:var(--green);border:2px solid #fffdf7;border-radius:50%;box-shadow:0 0 0 1px var(--green)}
.scale-ends,.people{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.people{margin:9px 0;justify-content:flex-start;flex-wrap:wrap}
.people span{padding:4px 8px;border-radius:5px;background:#e9eee3}
.people span+span{background:#f5e7d8}
.details{margin-top:15px;font-size:14px;color:var(--muted)}
summary{cursor:pointer;min-height:30px;padding:4px 0}
.details ul{padding-left:21px;line-height:1.65}
@media(max-width:840px){
  .shell{padding:0 26px}
  .hero{gap:25px}
  .hero h1{font-size:clamp(42px,7.5vw,67px)}
  .facets>div{padding-inline:12px}
}
@media(max-width:620px){
  .shell{padding:0 17px}
  .site-header{height:60px}
  .hero{grid-template-columns:1fr;padding:28px 0 22px;gap:20px}
  .hero h1{font-size:clamp(47px,12vw,69px);margin:14px 0}
  .hero-image{aspect-ratio:1.65}
  .facets{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:16px;padding:17px 0}
  .facets>div:nth-child(odd){padding-left:0;border-left:0}
  .facets>div:nth-child(even){padding-right:0}
  .facets span{margin-bottom:6px}
  .flow{margin:21px auto}
  footer{min-height:58px;font-size:12px}
}
.code-box{margin-top:18px;padding:12px 0;border-top:1px solid var(--line)}
.code-controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:9px}
.code-controls input{flex:1 1 15em;min-width:0;width:100%;min-height:48px;padding:8px 12px;font:inherit;color:var(--ink);background:#fffdf7;border:1px solid #a8b5aa;border-radius:8px}
.code-controls input:focus-visible{outline:3px solid #88511c;outline-offset:2px}
.match-components{margin-top:15px}
.dimension>p+p{margin-top:6px}

</style>
</head>
<body>
<div class="shell">
  <header class="site-header">
    <div class="wordmark"><span class="compass" aria-hidden="true">✦</span> 旅行搭子人格测试</div>
    <span class="header-note">出发前对一对</span>
  </header>
  <main id="access-gate" class="flow">
    <section class="sheet">
      <h1>输入口令，开始测试</h1>
      <form id="access-form" class="code-box" novalidate>
        <label for="access-pin">四位数访问口令</label>
        <div class="code-controls">
          <input id="access-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" required>
          <button class="primary" type="submit">进入测试</button>
        </div>
        <p id="access-error" class="status" role="status"></p>
      </form>
    </section>
  </main>
  <main id="app" hidden></main>
  <template id="quiz-home">
    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow"><span class="dot"></span> 16 道情境题 <span aria-hidden="true">·</span> 预计 3 分钟</div>
        <h1>旅行搭子，<br><em>合拍吗？</em></h1>
        <p class="intro">是多逛一站，还是坐下喝杯咖啡？<br>测出你的旅行人格。和搭子对一对匹配度，看看哪些安排出发前该先聊。</p>
        <div class="start-actions">
          <button id="start" class="primary">开始测试 <span aria-hidden="true">↗</span></button>
          <button id="duo" class="secondary">测双人匹配</button>
        </div>
        <p class="privacy">无需登录，答案只留在当前页面。</p>
      </div>
      <figure class="hero-image">
        <img alt="两位徒步旅行者望向山间湖泊" width="1280" height="853" src="./cover-v1.jpg">
      </figure>
    </section>
    <section class="facets" aria-label="测评维度">
      <div><span aria-hidden="true">◷</span><h2>行程节奏</h2><p>多逛一站，还是留点空白？</p></div>
      <div><span aria-hidden="true">▤</span><h2>规划方式</h2><p>出发前定好，还是到了再说？</p></div>
      <div><span aria-hidden="true">⇄</span><h2>旅行目的</h2><p>想探索新地方，还是好好享受？</p></div>
      <div><span aria-hidden="true">◎</span><h2>消费观念</h2><p>守住原预算，还是喜欢就加一点？</p></div>
    </section>
  </template>
  <footer><span>旅行搭子人格测试</span><span>按你这次想怎么旅行来选</span></footer>
</div>
<script>
'use strict';
// Dependency-free shared browser/Node engine. Never persists or sends answers.
const fail = message => { throw new Error(message); };
const own = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
const obj = (x,p) => { if (!x || typeof x !== 'object' || Array.isArray(x)) fail(`${p}: expected object`); };
const str = (x,p) => { if (typeof x !== 'string' || !x.trim()) fail(`${p}: expected nonempty string`); };
const num = (x,p) => { if (typeof x !== 'number' || !Number.isFinite(x)) fail(`${p}: expected finite number`); };
const arr = (x,p,nonempty=true) => { if (!Array.isArray(x) || (nonempty && !x.length)) fail(`${p}: expected array`); };
const unique = (xs,p) => { if (new Set(xs).size !== xs.length) fail(`${p}: duplicate ID/value`); };
const ident = (x,p) => { str(x,p); if(!/^[a-z][a-z0-9-]*$/.test(x)) fail(`${p}: invalid ID`); };
const exactKeys = (o,keys,p) => { obj(o,p); if(Object.keys(o).length!==keys.length || keys.some(k=>!own(o,k))) fail(`${p}: unexpected/missing keys`); };
const byId = (a,b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
function validateAssessment(a) {
 obj(a,'assessment');
 if(a.schemaVersion!==1) fail('schemaVersion: expected 1');
 ident(a.id,'id'); for(const k of ['version','title','intro','audience','purpose']) str(a[k],k);
 arr(a.limitations,'limitations'); a.limitations.forEach(x=>str(x,'limitations entry'));
 exactKeys(a.privacy,['storage','backend','perUserLLM','analytics'],'privacy');
 if(a.privacy.storage!=='memory'||a.privacy.backend!==false||a.privacy.perUserLLM!==false||a.privacy.analytics!==false) fail('privacy: only memory/no backend/no LLM/no analytics supported');
 obj(a.scale,'scale'); if(a.scale.min!==1 || a.scale.max!==5) fail('scale: supported range is 1–5');
 arr(a.scale.options,'scale.options');
 const values=a.scale.options.map(o=>{obj(o,'option'); str(o.label,'option.label'); return o.value;});
 if(values.length!==5 || [1,2,3,4,5].some(v=>!values.includes(v))) fail('scale.options: exactly 1–5 required');
 arr(a.constructs,'constructs'); a.constructs.forEach(c=>{obj(c,'construct');ident(c.id,'construct.id'); for(const k of ['name','definition','excludes','source','limitations']) str(c[k],`construct.${k}`);});
 const ids=a.constructs.map(c=>c.id); unique(ids,'constructs');
 arr(a.items,'items');
 a.items.forEach(q=>{obj(q,'item');ident(q.id,'item.id');str(q.text,'item.text');str(q.review,'item.review');if(!ids.includes(q.constructId)) fail('item.constructId: unknown');if(typeof q.reverse!=='boolean')fail('item.reverse: expected boolean');num(q.weight,'item.weight');if(q.weight<=0)fail('item.weight: must be positive');});
 unique(a.items.map(q=>q.id),'items');
 for(const id of ids) {
   const qs=a.items.filter(q=>q.constructId===id);
   if(qs.length<2)fail(`construct ${id}: requires at least two items`);
   if(!Number.isFinite(qs.reduce((s,q)=>s+q.weight,0)))fail('item weights: sum overflow');
 }
 obj(a.scoring,'scoring');if(a.scoring.method!=='weighted-normalized-v1')fail('scoring.method: unsupported');
 num(a.scoring.minCoverage,'minCoverage');num(a.scoring.tieEpsilon,'tieEpsilon');
 if(a.scoring.minCoverage<=0 || a.scoring.minCoverage>1)fail('minCoverage: must be in (0,1]');
 if(a.scoring.tieEpsilon<0 || a.scoring.tieEpsilon>100)fail('tieEpsilon: must be in [0,100]');
 obj(a.report,'report');arr(a.report.bands,'bands');
 let previous=-1;
 for(const b of a.report.bands){obj(b,'band');ident(b.id,'band.id');str(b.label,'band.label');num(b.max,'band.max');if(b.max<0||b.max<=previous||b.max>100)fail('bands: invalid boundaries');previous=b.max;}
 if(previous!==100)fail('bands: must end at 100');
 const bands=a.report.bands.map(b=>b.id);unique(bands,'bands');
 exactKeys(a.report.byConstruct,ids,'report.byConstruct');
 for(const id of ids){const r=a.report.byConstruct[id];obj(r,'construct report');exactKeys(r.interpretations,bands,'interpretations');bands.forEach(b=>str(r.interpretations[b],'interpretation'));for(const k of ['caveat','action','observe','fallback'])str(r[k],`report.${k}`);}
 arr(a.report.paths,'paths',false);
 for(const p of a.report.paths){obj(p,'path');ident(p.id,'path.id');for(const k of ['name','description','experiment','observe','caveat'])str(p[k],`path.${k}`);arr(p.constructIds,'path.constructIds');unique(p.constructIds,'path.constructIds');if(p.constructIds.some(id=>!ids.includes(id)))fail('path.constructIds: unknown construct');}
 unique(a.report.paths.map(p=>p.id),'paths');return a;
}
function score(a,input){
 validateAssessment(a);obj(input,'answers envelope');
 exactKeys(input,['assessmentId','version','answers'],'answers envelope');
 if(input.assessmentId!==a.id || input.version!==a.version)fail('answers: assessment ID/version mismatch');
 obj(input.answers,'answers');const answers=input.answers;const itemIds=new Set(a.items.map(q=>q.id));
 for(const [k,v] of Object.entries(answers)){if(!itemIds.has(k))fail(`answers: unknown item ${k}`);if(v!==null && (!Number.isInteger(v)||v<1||v>5))fail(`answers.${k}: expected integer 1–5 or null`);}
 const dimensions=a.constructs.map(c=>{
  const qs=a.items.filter(q=>q.constructId===c.id);
  const evidence=qs.filter(q=>own(answers,q.id)&&answers[q.id]!==null).map(q=>({itemId:q.id,text:q.text,raw:answers[q.id],adjusted:q.reverse?6-answers[q.id]:answers[q.id],reverse:q.reverse,weight:q.weight}));
  const coverage=evidence.length/qs.length;const eligible=coverage>=a.scoring.minCoverage;
  // Normalize weights first to avoid intermediate overflow for valid large weights.
  const w=evidence.reduce((s,e)=>s+e.weight,0);
  const value=eligible?Math.min(100,Math.max(0,100*evidence.reduce((s,e)=>s+(e.weight/w)*(e.adjusted-1)/4,0))):null;
  const band=value===null?null:a.report.bands.find(b=>value<=b.max);
  const r=a.report.byConstruct[c.id];
  return {id:c.id,name:c.name,answered:evidence.length,total:qs.length,coverage,status:eligible?'valid':'insufficient',score:value,bandId:band?.id??null,interpretation:band?r.interpretations[band.id]:'回答不足，暂不解释这一维度。',caveat:r.caveat,action:eligible?r.action:null,observe:eligible?r.observe:null,fallback:eligible?r.fallback:null,evidence};
 });
 const allValid=dimensions.every(d=>d.status==='valid');const ranked=dimensions.filter(d=>d.status==='valid').sort((a,b)=>b.score-a.score||byId(a,b));
 const topConstructIds=allValid?ranked.filter(d=>ranked[0].score-d.score<=a.scoring.tieEpsilon).map(d=>d.id):[];
 const paths=allValid?a.report.paths.map(p=>({...p,score:p.constructIds.reduce((s,id)=>s+dimensions.find(d=>d.id===id).score,0)/p.constructIds.length})).sort((a,b)=>b.score-a.score||byId(a,b)):[];
 for(const p of paths)p.highlighted=paths[0].score-p.score<=a.scoring.tieEpsilon;
 const answered=dimensions.reduce((s,d)=>s+d.answered,0);
 return {assessmentId:a.id,version:a.version,answered,total:a.items.length,coverage:answered/a.items.length,rankingStatus:allValid?'complete':'insufficient',topConstructIds,dimensions,paths,limitations:a.limitations};
}

const dimensions = [
  {
    id:'pace', name:'行程节奏', ends:['度假派','特种兵'],
    definition:'相同旅行时间内，对留白或多安排活动的偏好。', excludes:'体力和守时。',
    notes:['旅行日有空歇一歇，你会更自在。','你想走几站，取决于当天还有多少精神。','你喜欢把假期用足，多看看想去的地方。'],
    discuss:'每天各选一个必去点，再约好出门时间和什么时候收工。',
  },
  {
    id:'plan', name:'规划方式', ends:['随性派','规划控'],
    definition:'没有强制预约时，对现场决定或提前安排的偏好。', excludes:'规划能力和临时应变能力。',
    notes:['到了再看天气和心情，你玩得更自在。','你愿意先定一部分，其他的到现场再说。','提前知道去哪、怎么走，通常让你更安心。'],
    discuss:'先定谁负责查路线、哪些事必须两个人一起决定。',
  },
  {
    id:'purpose', name:'旅行目的', ends:['探索体验派','感官享受派'],
    definition:'在探索地方特色与享受食宿、氛围和出片体验之间的取舍。', excludes:'户外能力、审美和帮拍意愿。',
    notes:['你更容易被当地生活、自然和新鲜经历吸引。','探索新地方和好好享受这趟旅程，对你都有吸引力。','好吃、好住、好看，这些细节很容易让你觉得这一趟来值惹。'],
    discuss:'各挑一个最想做的项目，排进同一天或给彼此留自由时间。',
  },
  {
    id:'spend', name:'消费观念', ends:['精打细算','体验优先'],
    definition:'两个方案都负担得起时，对守住预算或为体验加钱的偏好。', excludes:'实际收入、支付能力和可接受的具体金额。',
    notes:['你乐意为了性价比，多看一眼替代方案。','你愿意为少数特别在乎的体验加钱。','好体验值得时，你愿意在可承受范围内多花一点。'],
    discuss:'先对齐人均上限和住宿底线，只有一人想升级时再谈差价。',
  },
];

const scenarios = [
  ['pace','难得有个不用赶车的旅行日，你想怎么安排？','只挑一个地方，其余时间慢慢晃','定两站想去的地方，中间留一段休息时间','排三四站，少留一点空档','把想去的地方都串起来，一天逛五站左右'],

const minutes = [2,10,30];
const average = values => values.reduce((sum,value)=>sum+value,0)/values.length;
const rounded = value => Math.round(value+1e-9);

// In a tie, prefer the scenario that most directly asks about this preference.
const titleQuestionOrder = {
  pace:['v4-q1','v4-q5','v4-q9'],
  plan:['v4-q2','v4-q6','v4-q10'],
  purpose:['v4-q3','v4-q7','v4-q11'],
  spend:['v4-q12','v4-q8','v4-q4'],
};

function titlePreference(dimension) {
  if (dimension.score===null || Math.abs(dimension.score-50)>1e-9) {
    return {side:dimension.bandId,questionId:null};
  }
  for (const questionId of titleQuestionOrder[dimension.id]) {
    const answer = dimension.evidence.find(item=>item.itemId===questionId);
    if (answer) {
      return {side:answer.adjusted>3?'high':'low',questionId};
    }
  }
  return {side:null,questionId:null};
}

function travelResult(answers) {
  const core = Object.fromEntries(assessment.items.map(q=>{
    const value = answers[q.id] ?? null;
    if (value!==null && !q.options.some(option=>option.value===value)) throw new Error('Invalid answer');
    return [q.id,value];
  }));
  const result = score(assessment,{assessmentId:assessment.id,version:assessment.version,answers:core});
  const choices = practical.map(q=>{
    const value = answers[q.key] ?? null;
    if (value!==null && !q.options.some(o=>o.value===value)) throw new Error('Invalid answer');
    return value;
  });
  const [role,alone,photoNeed,photoHelp] = choices;
  const titlePreferences = result.dimensions.map(titlePreference);
  const profile = titlePreferences.some(({side})=>side===null) ? null : profiles.find(({code})=>
    titlePreferences.every(({side},i)=>Boolean(code & (8>>i))===(side==='high')));
  return {
    ...result,profile,titlePreferences,role,alone,photoNeed,photoHelp,
    morning:core['v4-q5'],room:core['v4-q12'],
    title:profile?.title ?? '你的旅行偏好',
  };
}

function similarity(a,b,range=100) {
  return a===null || b===null ? null : Math.max(0,100*(1-Math.abs(a-b)/range));
}

function photoMatch(a,b) {
  if ([a.photoNeed,a.photoHelp,b.photoNeed,b.photoHelp].includes(null)) return null;
  const needs = [minutes[a.photoNeed],minutes[b.photoNeed]];
  const offers = [minutes[b.photoHelp],minutes[a.photoHelp]];
  const scores = needs.map((need,i)=>100*Math.min(1,offers[i]/need));
  return {score:average(scores),needs,offers};
}

// Rows are the first person's stated role; the matrix is symmetric.
const roles = [
  [75,95,100,40],
  [95,100,80,70],
  [100,80,50,55],
  [40,70,55,90],
];

function compareResults(a,b) {
  const preferences = [0,2,3].map(i=>similarity(a.dimensions[i].score,b.dimensions[i].score));
  const shared = preferences.includes(null)?null:average(preferences);
  const role = a.role===null || b.role===null ? null : roles[a.role][b.role];
  const photo = photoMatch(a,b);
  const reality = [similarity(a.morning,b.morning,4),similarity(a.room,b.room,4),similarity(a.alone,b.alone,2),photo?.score??null];
  const practicalFit = reality.includes(null)?null:average(reality);
  const hard = [
    preferences[0]!==null && preferences[0]<=100/3+1e-9 ? '行程节奏' : null,
    preferences[2]!==null && preferences[2]<=100/3+1e-9 ? '消费观念' : null,
  ].filter(Boolean);
  const components = [shared,role,practicalFit];
  const combined = components.includes(null)?null:0.5*shared+0.3*role+0.2*practicalFit;
  return {
    score:combined===null?null:rounded(Math.min(combined,hard.length?69:100)),
    components:components.map(x=>x===null?null:rounded(x)),hard,photo,
    rows:a.dimensions.map((d,i)=>({a:d,b:b.dimensions[i],similarity:similarity(d.score,b.dimensions[i].score)})),
    reality,
  };
}

function exampleBuddies(profile) {
  const scoreOf = code => [8,2,1].reduce((sum,bit)=>sum+Number((profile.code & bit)===(code & bit)),0);
  const peers = profiles.filter(other=>other.code!==profile.code);
  const values = peers.map(other=>scoreOf(other.code));
  const highest = Math.max(...values);
  const lowest = Math.min(...values);
  return {
    best:peers.filter(other=>scoreOf(other.code)===highest),
    friction:peers.filter(other=>scoreOf(other.code)===lowest),
    frictionReasons:[dimensions[0].name,dimensions[2].name,dimensions[3].name],
  };
}

const codeVersion = 'TB4-';

function encodeTravel(answers) {
  travelResult(answers);
  return codeVersion+questions.map(q=>{
    const value=answers[q.id];
    if (value==null) return '0';
    const position=q.options.findIndex(option=>option.value===value);
    if (position<0) throw new Error('Invalid answer');
    return String(position+1);
  }).join('');
}

function decodeTravel(code) {
  const normalized=code.trim().toUpperCase();
  if (/^TB[23]-/.test(normalized)) throw new Error('这是旧版匹配码。题目已更新，请用新版重新答题生成匹配码。');
  const digits=normalized.slice(codeVersion.length);
  if (!normalized.startsWith(codeVersion)||digits.length!==questions.length||!/^[0-4]+$/.test(digits)) throw new Error('匹配码格式不对，请检查是否复制完整。');
  return Object.fromEntries(questions.map((q,i)=>{
    const digit=Number(digits[i]);
    if (digit>q.options.length) throw new Error('匹配码里有无效答案。');
    return [q.id,digit===0?null:q.options[digit-1].value];
  }));
}


const app = document.querySelector('#app');
const home = [...document.querySelector('#quiz-home').content.children];
const total = questions.length;

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text != null) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function button(text, action, className = 'secondary') {
  const node = element('button',text,className);
  node.type = 'button';
  node.addEventListener('click',action);
  return node;
}

function frame(nextScreen) {
  screen = nextScreen;
  const flow = element('div',null,'flow');
  app.replaceChildren(flow);
  return flow;
}

function focusHeading(heading) {
  heading.tabIndex = -1;
  heading.focus({preventScroll:true});
  window.scrollTo(0,0);
}

function introCard(flow, label, title, description, className = 'sheet') {
  const card = element('section',null,className);
  const heading = element('h1',title);
  card.append(element('div',label,'eyebrow'),heading,element('p',description,'subtitle'));
  flow.append(card);
  focusHeading(heading);
  return card;
}

function showHome() {
  answers = [];
  screen = 'home';
  app.replaceChildren(...home);
  focusHeading(app.querySelector('h1'));
}

function start(duo) {
  answers = duo ? [{},{}] : [{}];
  participant = 0;
  index = 0;
  editing = false;
  locked = false;
  showQuestion();
}

function addPartner() {
  if (answers.length === 1) answers.push({});
  participant = 1;
  index = 0;
  editing = false;
  const flow = frame('handoff');
  const card = introCard(flow,'双人匹配','现在轮到搭子','把设备交给搭子，或输入对方在另一台设备上测出的匹配码。');
  const actions = element('div',null,'actions');
  actions.append(button('搭子开始答题',showQuestion,'primary'),button('先看我的结果',()=>showResult(0)));
  card.append(actions,codeInput());
}

function record(value) {
  if (screen !== 'question' || locked) return;
  locked = true;
  answers[participant][questions[index].id] = value;
  const options = app.querySelectorAll('.option');
  options.forEach(option=>option.setAttribute('aria-pressed',String(Number(option.dataset.value)===value)));
  window.setTimeout(()=>{
    if (editing || index === total-1) showReview();
    else {
      index++;
      showQuestion();
    }
    locked = false;
  },160);
}

function showQuestion() {
  const flow = frame('question');
  const card = element('section',null,'sheet');
  const q = questions[index];
  const current = answers[participant][q.id];
  const caption = element('div',null,'progress-label');
  const who = answers.length===2 ? (participant===0 ? '你先答' : '搭子作答') : '旅行情境';
  caption.append(element('span',who),element('span','第 '+(index+1)+' / '+total+' 题'));
  const progress = element('progress');
  progress.max = total;
  progress.value = index+1;
  progress.setAttribute('aria-label','当前题号');
  const heading = element('h1',q.text);
  const options = element('div',null,'options');
  q.options.forEach(({label,value},i)=>{
    const option = button(null,()=>record(value),'option');
    option.dataset.value = value;
    option.setAttribute('aria-pressed',String(current===value));
    const letter = element('span','ABCD'[i],'option-letter');
    letter.setAttribute('aria-hidden','true');
    option.append(letter,element('span',label));
    options.append(option);
  });
  const actions = element('div',null,'actions quiz-actions');
  actions.append(button(editing?'返回复核':index>0?'上一题':'返回首页',()=>{
    if (locked) return;
    if (editing) showReview();
    else if (index>0) {
      index--;
      showQuestion();
    } else if (participant===1) addPartner();
    else showHome();
  },'plain'));
  if (!editing && Object.hasOwn(answers[participant],q.id)) {
    actions.append(button(index===total-1?'去复核':'下一题',()=>{
      if (locked) return;
      if (index===total-1) showReview();
      else {
        index++;
        showQuestion();
      }
    },'plain'));
  }
  actions.append(button('跳过这题',()=>record(null),'plain'));
  card.append(caption,progress,heading);
  if (index===0 && !editing) card.append(element('p',assessment.intro,'subtitle'));
  card.append(options,actions);
  flow.append(card);
  focusHeading(heading);
}

function editAnswer(person, questionIndex) {
  participant = person;

function showReview() {
  editing = false;
  const flow = frame('review');
  const current = answers[participant];
  const done = Object.values(current).filter(value=>value!==null).length;
  const card = introCard(flow,'答题复核',participant===0?'看看你的答案':'看看搭子的答案','已答 '+done+' / '+total+' 题，可以修改后再看结果。');
  const list = element('div',null,'review-list');
  questions.forEach((q,i)=>{
    const row = element('div',null,'review-row');
    const item = element('div');
    const label = q.options.find(option=>option.value===current[q.id])?.label ?? '已跳过';
    item.append(element('h2',(i+1)+'. '+q.text),element('p',label));
    const edit = button('修改',()=>editAnswer(participant,i),'plain');

    if (participant===1) showComparison();
    else showResult(0);
  },'primary'));
  card.append(list,actions);
}

function dimLabel(d,meta) {
  if (!d.bandId) return '答题不足';
  return d.bandId==='mid'?'两边都可以':meta.ends[d.bandId==='high'?1:0];
}

function dimensionCard(d,meta,titleChoice) {
  const card = element('section',null,'dimension');
  const head = element('div',null,'dimension-head');
  head.append(element('h2',d.name),element('span','已答 '+d.answered+' / '+d.total+' 题'));
  card.append(head,element('p',dimLabel(d,meta),'status'),element('p',d.interpretation));
  if (d.score === null) return card;
  const scale = element('div',null,'scale');
  scale.setAttribute('aria-hidden','true');
  const track = element('div',null,'scale-track');
  const marker = element('span');
  marker.style.left = d.score+'%';
  track.append(marker);
  const labels = element('div',null,'scale-ends');
  labels.append(...meta.ends.map(end=>element('span',end)));
  scale.append(track,labels);
  card.append(scale,element('p','出发前可以聊聊。'+d.action));
  const evidence = element('details',null,'details');
  evidence.append(element('summary','查看作答依据'));
  if (titleChoice.questionId) {
    const chosen = assessment.items.find(q=>q.id===titleChoice.questionId);
    const option = chosen.options.find(o=>o.value===d.evidence.find(item=>item.itemId===chosen.id).raw);
    evidence.append(element('p','这一项总分打平，称号参考了这道题。'+chosen.text+' 你选了「'+option.label+'」。'));
  }
  const list = element('ul');
  for (const item of d.evidence) {
    const answer = assessment.items.find(q=>q.id===item.itemId).options.find(o=>o.value===item.raw);
    list.append(element('li',item.text+' '+answer.label));
  }
  evidence.append(list,element('p',d.observe),element('p',d.fallback));
  card.append(evidence);
  return card;
}

function method(flow) {
  const details = element('details',null,'details');
  details.append(element('summary','怎么算的'));
  details.append(element('p','每个旅行维度有 3 道题，每题两边各有轻重两档。先看合计偏向哪边，打平时参考最能体现该偏好的一道已答题。每个维度至少答两题，才会生成称号。'));
  details.append(element('p','匹配度由偏好一致（50%）、角色互补（30%）、现实适配（20%）组成。偏好一致看行程节奏、旅行目的和消费观念。角色互补看谁愿意安排、跟随或保留自主。现实适配看早起、住宿、分头活动和拍照。'));
  details.append(element('p','行程节奏或消费观念的差距达到整个刻度的三分之二时，匹配度最高显示 69%。出片友好度看双方愿意给对方帮拍的时间，各自满足多少再取平均。'));
  for (const line of assessment.limitations) details.append(element('p',line));
  flow.append(details);
}

function codeInput() {
  const section = element('section',null,'code-box');
  const label = element('label','搭子的匹配码');
  label.htmlFor = 'partner-code';
  const input = element('input');
  input.id='partner-code';
  input.type='text';
  input.autocomplete='off';
  input.spellcheck=false;
  input.maxLength=32;
  input.placeholder='粘贴对方的匹配码';
  const error = element('p',null,'status');
  error.setAttribute('role','status');
  const submit = ()=>{
    try {
      answers[1] = decodeTravel(input.value);
    } catch (problem) {
      error.textContent=problem.message;
      input.focus();
      return;
    }
    showComparison();
  };
  input.addEventListener('keydown',event=>{
    if (event.key==='Enter') submit();
  });
  const controls = element('div',null,'code-controls');
  controls.append(input,button('查看匹配度',submit));
  section.append(label,controls,error);
  return section;
}

function resultCard(result) {
  const section = element('section',null,'dimension');
  section.append(element('h2','出发前找什么样的搭子'));
  if (result.profile) {
    const {best,friction,frictionReasons} = exampleBuddies(result.profile);
    section.append(
      element('p','容易合拍的类型 · '+best.map(p=>p.title).join('、'),'status'),
      element('p','行程节奏、旅行目的和消费观念的典型偏好相近，可以先聊聊怎么分工。'),
      element('p','出发前多聊聊的类型 · '+friction.map(p=>p.title).join('、'),'status'),
      element('p',frictionReasons.join('、')+'的典型偏好差别大，先对一对每日安排和人均预算。'),
    );
  } else {
    const missing = result.dimensions.filter(d=>d.score===null);
    const needs = missing.map(d=>d.name+'还需答 '+(2-d.answered)+' 题').join('，');
    section.append(element('p',needs+'。可以点「修改答案」补答。'));
  }
  return section;
}

function codeBox(person) {
  const details = element('details',null,'details code-box');
  details.append(element('summary','分享匹配码给搭子'));
  details.append(element('p','把匹配码发给对方，TA 答完后就能在自己的设备上对比。匹配码包含本次选择，对方可通过报告查看你的作答依据。'));
  const code = element('input');
  code.readOnly=true;
  code.value=encodeTravel(answers[person]);
  code.setAttribute('aria-label','我的匹配码');
  const label = element('p',null,'status');
  label.setAttribute('role','status');
  const controls = element('div',null,'code-controls');
  controls.append(code,button('复制匹配码',async()=>{
    try {
      await navigator.clipboard.writeText(code.value);
      label.textContent='已复制匹配码';
    } catch {
      code.focus();
      code.select();
      label.textContent='已选中匹配码，可以手动复制。';
    }
  }));
  details.append(controls,label);
  return details;
}

function downloadCard(result) {
  const canvas = element('canvas');
  canvas.width=900;
  canvas.height=1200;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#f8f6ed';
  ctx.fillRect(0,0,900,1200);
  ctx.fillStyle='#235444';
  ctx.fillRect(0,0,900,24);
  const line=(text,x,y,size,color='#1c302b',weight=500)=>{
    ctx.fillStyle=color;
    ctx.font=weight+' '+size+'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(text,x,y);
  };
  const block=(text,x,y,size,color)=>{
    ctx.font='500 '+size+'px "PingFang SC","Microsoft YaHei",sans-serif';
    let current='';
    for (const letter of text) {
      if (current && ctx.measureText(current+letter).width>756) {
        line(current,x,y,size,color);
        y+=size+14;
        current='';
      }
      current+=letter;
    }
    line(current,x,y,size,color);
    return y+size+14;
  };
  line('旅行搭子人格测试',72,113,32,'#235444',700);
  line(result.title,72,240,79,'#1c302b',700);
  block(result.profile.description,72,310,34,'#52625a');
  result.dimensions.forEach((d,i)=>{
    const y=459+i*103;
    ctx.fillStyle='#e6ebde';
    ctx.fillRect(72,y-50,756,78);
    line(d.name,100,y,31);
    line(dimLabel(d,dimensions[i]),425,y,32,'#235444',700);
  });
  const {best,friction}=exampleBuddies(result.profile);
  block('容易合拍 · '+best.map(p=>p.title).join('、'),72,903,28,'#235444');
  block('出发前多聊聊 · '+friction.map(p=>p.title).join('、'),72,1008,28,'#52625a');
  line('这张卡片反映本次作答的旅行偏好',72,1126,23,'#52625a');
  const link=element('a');
  link.href=canvas.toDataURL('image/png');
  link.download=result.profile.title+'-旅行搭子.png';
  link.click();
}

function showResult(person) {
  const result = travelResult(answers[person]);
  const flow = frame('result');
  const usedTiebreak = result.titlePreferences.some(choice=>choice.questionId);
  const lead = result.profile
    ? result.profile.description + (usedTiebreak ? ' 有些维度两边都可以，称号参考了你在具体场景里的选择。' : '')
    : '每个维度至少各答两题，就能看到你的旅行人格。';
  const card = introCard(flow,(person===0?'你的旅行风格':'搭子的旅行风格')+' · 已答 '+Object.values(answers[person]).filter(x=>x!=null).length+' / '+total+' 题',result.title,lead,'sheet result-header');
  const actions = element('div',null,'actions');
  const paired = answers[1] && Object.keys(answers[1]).length===total;
  actions.append(paired ? button('查看双人匹配',showComparison,'primary') : button('和搭子测匹配度',addPartner,'primary'));
  if (result.profile) actions.append(button('下载分享卡',()=>downloadCard(result)));
  actions.append(button('修改答案',()=>{ participant=person; showReview(); }),button('重新测试',showHome,'plain'));
  card.append(actions,codeBox(person));
  const list = element('div',null,'results');
  list.append(resultCard(result));
  result.dimensions.forEach((d,i)=>list.append(dimensionCard(d,dimensions[i],result.titlePreferences[i])));
  const photo = element('section',null,'dimension');
  photo.append(element('h2','你的出片偏好'));
  for (const [i,value] of [[2,result.photoNeed],[3,result.photoHelp]]) {
    photo.append(element('p',(i===2?'自己拍 · ':'帮对方拍 · ')+(practical[i].options[value]?.label??'待补答')));
  }
  list.append(photo);
  flow.append(list);
  method(flow);
}

function showComparison() {
  const a = travelResult(answers[0]);
  const b = travelResult(answers[1]);
  const match = compareResults(a,b);
  const flow = frame('comparison');
  const title = match.score===null?'补答后可看完整匹配度':'旅行匹配度 '+match.score+'%';
  const lead = match.hard.length ? '出发前先聊'+match.hard.join('和')+'。这些差异会限制总分。'
    : match.score===null ? '下方仍可看已答出的偏好和建议。' : '看看哪里合拍，哪些安排值得提前说好。';
  const card = introCard(flow,a.title+' × '+(b.profile?.title??'搭子的旅行偏好'),title,lead,'sheet result-header');
  const components = element('div',null,'people match-components');
  ['偏好一致','角色互补','现实适配'].forEach((name,i)=>components.append(element('span',name+' · '+(match.components[i]??'待补答'))));
  const actions = element('div',null,'actions');
  actions.append(button('看我的结果',()=>showResult(0)),button('看搭子的结果',()=>showResult(1)),button('重新测试',showHome,'plain'));
  card.append(components,actions);
  const list = element('div',null,'results');
  if (match.score!==null) {
    const trip=element('section',null,'dimension');
    const pace=match.rows[0];
    const purpose=match.rows[2];
    let idea='各选一个最想做的项目，再一起挑一顿饭或一处景点。';
    if (match.hard.length) idea='先试半天短途。各选一个想去的地方，约好人均上限和碰头时间。';
    else if (purpose.a.score<50 && purpose.b.score<50) {
      idea=pace.a.score>50 && pace.b.score>50
        ? '试试串联老街、市集和博物馆的城市探索路线。'
        : '试试只选一个街区的深度游，留时间给小店和当地人的故事。';
    } else if (purpose.a.score>50 && purpose.b.score>50) {
      idea=pace.a.score>50 && pace.b.score>50
        ? '试试串联几处餐厅、店铺和拍照点的城市周末游。'
        : '试试住得舒服的慢旅行，每天只安排一顿期待的饭或一个拍照点。';
    }
    trip.append(element('h2','可以先试这种旅行'),element('p',idea));
    list.append(trip);
  }
  match.rows.forEach((row,i)=>{
    const {a: first,b: second,similarity} = row;
    const meta=dimensions[i];
    const section=element('section',null,'dimension');
    const head=element('div',null,'dimension-head');
    const status=similarity===null?'待补答':match.hard.includes(first.name)?'优先聊':similarity<=50?'有些差异':'偏好接近';
    head.append(element('h2',first.name),element('span',status));
    const people=element('div',null,'people');
    people.append(element('span','你 · '+dimLabel(first,meta)),element('span','搭子 · '+dimLabel(second,meta)));
    section.append(head,people,element('p',meta.discuss));
    if (i===1) {
      section.append(element('p','你的分工 · '+(practical[0].options[a.role]?.label??'待补答')),
        element('p','搭子的分工 · '+(practical[0].options[b.role]?.label??'待补答')));
    }
    list.append(section);
  });
  const reality = element('section',null,'dimension');
  reality.append(element('h2','出发前再对这几件事'));
  const detail = [
    '作息 · 先约一个双方都能接受的出门时间。',
    '住宿 · 各说一个住宿底线，再定同住或分开订。',
    '独处 · 留出可以分开逛的时段，并约好在哪里碰头。',
  ];
  detail.forEach((line,i)=>{
    if (match.reality[i]!==null && match.reality[i]<=50) reality.append(element('p',line));
  });
  if (reality.children.length===1) reality.append(element('p','把出门时间、住宿底线和自由活动时段说清楚。'));
  list.append(reality);
  const photo=element('section',null,'dimension');
  photo.append(element('h2',match.photo?'出片友好度 '+Math.round(match.photo.score)+'%':'出片友好度待补答'));
  if (match.photo) {
    const {needs,offers}=match.photo;
    photo.append(
      element('p','你想拍 '+needs[0]+' 分钟，搭子愿意帮拍 '+offers[0]+' 分钟。'),
      element('p','搭子想拍 '+needs[1]+' 分钟，你愿意帮拍 '+offers[1]+' 分钟。'),
      element('p',match.photo.score<100?'先约每个人能拍多久，超出的部分可以自拍或留到自由活动。':'可以约一处两个人都想拍的地方，互相留出时间。','status'),
    );
  } else photo.append(element('p','两个人都答过拍照需求和帮拍意愿后，就能对比。'));
  list.append(photo);
  flow.append(list);
  method(flow);
}

const accessGate = document.querySelector('#access-gate');
const accessPin = document.querySelector('#access-pin');
const accessError = document.querySelector('#access-error');
const accessForm = document.querySelector('#access-form');

accessForm.addEventListener('submit',event=>{
  event.preventDefault();
  const pin = accessPin.value.trim();
  if (pin!=='6847') {
    accessError.textContent = /^\d{4}$/.test(pin) ? '口令不对，再试一次。' : '请输入四位数字。';
    accessPin.setAttribute('aria-invalid','true');
    accessPin.focus();
    accessPin.select();
    return;
  }
  accessPin.value = '';
  accessError.textContent = '';
  accessPin.removeAttribute('aria-invalid');
  app.replaceChildren(...home);
  app.querySelector('#start').addEventListener('click',()=>start(false));
  app.querySelector('#duo').addEventListener('click',()=>start(true));
  accessGate.hidden = true;
  app.hidden = false;
  focusHeading(app.querySelector('h1'));
});

</script>
