<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">字雀文字麻将封面</title>
  <desc id="desc">墨绿色桌面上摆放着写有字雀二字的白色麻将牌</desc>
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183d35"/>
      <stop offset="1" stop-color="#071b18"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="18" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#felt)"/>
  <circle cx="1340" cy="170" r="260" fill="#d6a14a" opacity=".12"/>
  <circle cx="180" cy="760" r="300" fill="#4a9b81" opacity=".10"/>
  <g filter="url(#shadow)" transform="translate(455 130) rotate(-4 345 295)">
    <rect x="0" y="0" width="320" height="590" rx="46" fill="#d6c9a5"/>
    <rect x="0" y="0" width="320" height="560" rx="46" fill="#f7f1df"/>
    <rect x="20" y="20" width="280" height="520" rx="32" fill="none" stroke="#d7c9a8" stroke-width="7"/>
    <text x="160" y="355" text-anchor="middle" font-family="serif" font-weight="700" font-size="210" fill="#bd3f38">字</text>
  </g>
  <g filter="url(#shadow)" transform="translate(825 160) rotate(5 345 295)">
    <rect x="0" y="0" width="320" height="590" rx="46" fill="#d6c9a5"/>
    <rect x="0" y="0" width="320" height="560" rx="46" fill="#f7f1df"/>
    <rect x="20" y="20" width="280" height="520" rx="32" fill="none" stroke="#d7c9a8" stroke-width="7"/>
    <text x="160" y="355" text-anchor="middle" font-family="serif" font-weight="700" font-size="210" fill="#176b52">雀</text>
  </g>
  <text x="800" y="820" text-anchor="middle" font-family="sans-serif" font-size="62" font-weight="700" letter-spacing="12" fill="#f2e5c8">和朋友一起打文字麻将</text>
</svg>
